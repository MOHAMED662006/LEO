<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | NEXORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body class="admin-body">
  <header class="site-header">
    <nav class="container nav">
      <a class="logo" href="index.html"><span class="logo-mark">N</span>NEXORA<span class="dot">.</span></a>
      <span class="admin-label">لوحة إدارة الطلبات</span>
      <button class="btn btn-small btn-outline" id="logoutButton" hidden>تسجيل الخروج</button>
    </nav>
  </header>

  <main class="container admin-main">
    <section class="admin-login" id="loginPanel">
      <span class="eyebrow">مساحة خاصة بالإدارة</span>
      <h1>أهلًا بعودتك</h1>
      <p>سجّل الدخول لمتابعة طلبات العملاء.</p>
      <form id="loginForm" class="contact-form">
        <label>البريد الإلكتروني<input type="email" name="email" autocomplete="username" required placeholder="mail@example.com"></label>
        <label>كلمة المرور<input type="password" name="password" autocomplete="current-password" required placeholder="كلمة المرور"></label>
        <button class="btn btn-primary btn-full" type="submit">تسجيل الدخول</button>
        <p class="form-note" id="loginMessage" role="status"></p>
      </form>
    </section>

    <section id="dashboardPanel" hidden>
      <div class="admin-heading">
        <div><span class="eyebrow">NEXORA / ADMIN</span><h1>طلبات العملاء</h1><p>تابع الرسائل والطلبات الواردة من نموذج التواصل.</p></div>
        <button class="btn btn-primary" id="refreshButton">تحديث الطلبات ↻</button>
      </div>
      <div class="admin-stats">
        <div><span>إجمالي الطلبات</span><strong id="requestCount">0</strong></div>
        <div><span>آخر تحديث</span><strong id="lastUpdated">—</strong></div>
      </div>
      <p class="admin-status" id="dashboardMessage" role="status"></p>
      <div class="requests-wrap">
        <div class="requests-header"><h2>كل الطلبات</h2><span>الأحدث أولًا</span></div>
        <div id="requestsList" class="requests-list"></div>
      </div>
    </section>
  </main>
</body>
</html>
